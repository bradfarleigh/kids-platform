<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Videos</title>
  <link rel="stylesheet" href="css/kids.css">
  <style>
    body { overflow-y: auto; }

    .empty-state {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      padding: 40px 20px; text-align: center;
    }
    .empty-state-icon  { font-size: 80px; }
    .empty-state-title { font-size: 28px; font-weight: 900; color: white; }
    .empty-state-sub   { font-size: 18px; color: rgba(255,255,255,.75); font-weight: 700; max-width: 340px; }

    .player-section {
      width: 100%; max-width: 900px;
      margin: 0 auto; padding: 0 16px;
    }

    .player-box {
      width: 100%; aspect-ratio: 16/9;
      border-radius: 16px; overflow: hidden; background: #000;
    }
    .player-box iframe { width: 100%; height: 100%; border: none; }

    .video-info { padding: 10px 0 2px; }
    .video-info-title {
      font-size: clamp(15px, 2.8vw, 20px);
      font-weight: 900; color: white; line-height: 1.3;
    }
    .video-info-channel {
      font-size: 13px; color: rgba(255,255,255,.65);
      font-weight: 700; margin-top: 3px;
    }

    .nav-row { display: flex; gap: 10px; padding: 10px 0 20px; }
    .nav-btn {
      flex: 1; padding: 14px 12px; border: none; border-radius: 14px;
      background: rgba(255,255,255,.2); backdrop-filter: blur(8px);
      color: white; font-size: clamp(14px, 3vw, 18px);
      font-weight: 900; cursor: pointer; font-family: inherit;
      transition: transform .12s, opacity .12s;
    }
    .nav-btn:active { transform: scale(.93); }
    .nav-btn:disabled { opacity: .3; cursor: default; transform: none; }

    .strip-label {
      font-size: 12px; font-weight: 800;
      text-transform: uppercase; letter-spacing: .5px;
      color: rgba(255,255,255,.55);
      padding: 0 16px 8px;
      max-width: 900px; margin: 0 auto; width: 100%;
    }

    .thumb-strip {
      display: flex; gap: 10px;
      overflow-x: auto; padding: 0 16px 32px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .thumb-strip::-webkit-scrollbar { display: none; }

    .thumb-card {
      flex: 0 0 130px; border: none; border-radius: 10px;
      overflow: hidden; background: rgba(255,255,255,.12);
      cursor: pointer; scroll-snap-align: start;
      outline: 3px solid transparent; outline-offset: 2px;
      padding: 0; font-family: inherit; text-align: left;
      transition: transform .12s;
    }
    .thumb-card:active { transform: scale(.94); }
    .thumb-card.active { outline-color: #FFE66D; }

    .thumb-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
    .thumb-card-title {
      font-size: 11px; font-weight: 800; color: white;
      padding: 5px 7px 7px;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3;
    }
  </style>
</head>
<body>
  <button class="nav-back" onclick="location.href='index.html'">🏠</button>
  <h1 class="page-title">Videos 📺</h1>
  <div id="content"></div>

  <script>
    let videos = [];
    let currentIndex = 0;

    function iframeSrc(id) {
      return `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&modestbranding=1&iv_load_policy=3&playsinline=1`;
    }

    function playVideo(index) {
      currentIndex = index;
      const v = videos[index];
      document.getElementById('player-iframe').src = iframeSrc(v.id);
      document.getElementById('vid-title').textContent = v.title;
      document.getElementById('vid-channel').textContent = v.channelTitle || '';
      document.getElementById('btn-prev').disabled = index === 0;
      document.getElementById('btn-next').disabled = index === videos.length - 1;
      document.querySelectorAll('.thumb-card').forEach((c, i) => c.classList.toggle('active', i === index));
      document.querySelectorAll('.thumb-card')[index]?.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }

    function renderPlayer() {
      document.getElementById('content').innerHTML = `
        <div class="player-section">
          <div class="player-box">
            <iframe id="player-iframe" src="" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
          </div>
          <div class="video-info">
            <div class="video-info-title" id="vid-title"></div>
            <div class="video-info-channel" id="vid-channel"></div>
          </div>
          <div class="nav-row">
            <button class="nav-btn" id="btn-prev" onclick="playVideo(currentIndex - 1)">← Prev</button>
            <button class="nav-btn" id="btn-next" onclick="playVideo(currentIndex + 1)">Next →</button>
          </div>
        </div>
        <div class="strip-label">More videos</div>
        <div class="thumb-strip" id="thumb-strip"></div>`;

      const strip = document.getElementById('thumb-strip');
      videos.forEach((v, i) => {
        const btn = document.createElement('button');
        btn.className = 'thumb-card';
        btn.innerHTML = `<img src="${esc(v.thumbnail)}" alt="" loading="lazy"><div class="thumb-card-title">${esc(v.title)}</div>`;
        btn.addEventListener('click', () => playVideo(i));
        btn.addEventListener('touchstart', () => {}, { passive: true });
        strip.appendChild(btn);
      });

      playVideo(0);
    }

    async function fetchVideos() {
      try {
        const r = await fetch('/api/videos');
        if (r.ok && r.headers.get('content-type')?.includes('json')) return r.json();
      } catch {}
      return (await fetch('data/videos.json')).json();
    }

    async function init() {
      const content = document.getElementById('content');
      try {
        videos = await fetchVideos();
        if (!videos.length) {
          content.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">📭</div>
              <div class="empty-state-title">No videos yet!</div>
              <div class="empty-state-sub">Ask a grown-up to add some videos for you.</div>
            </div>`;
          return;
        }
        renderPlayer();
      } catch {
        content.innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-title">Couldn't load videos</div></div>`;
      }
    }

    function esc(s = '') {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    init();
  </script>
</body>
</html>
