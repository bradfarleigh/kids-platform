<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Tracing</title>
  <link rel="stylesheet" href="../../css/kids.css">
  <style>
    body { background: linear-gradient(160deg, #a18cd1 0%, #fbc2eb 100%); }

    #screen-mode {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 28px; padding: 20px;
    }
    #screen-difficulty {
      display: none; flex: 1; flex-direction: column;
      align-items: center; justify-content: center; gap: 28px; padding: 20px;
    }
    #screen-style {
      display: none; flex: 1; flex-direction: column;
      align-items: center; justify-content: center; gap: 28px; padding: 20px;
    }
    .mode-title {
      font-size: clamp(32px, 7vw, 60px); font-weight: 900;
      color: white; text-shadow: 0 3px 12px rgba(0,0,0,.2);
    }
    .mode-cards {
      display: grid; grid-template-columns: 1fr; gap: 18px;
      width: 100%; max-width: 360px;
    }
    .mode-card {
      background: white; border-radius: 24px; padding: 26px 20px;
      text-align: center; cursor: pointer; box-shadow: 0 8px 32px rgba(0,0,0,.12);
      transition: transform .15s cubic-bezier(.34,1.56,.64,1);
      display: flex; align-items: center; gap: 18px;
      border: none; font-family: inherit;
    }
    .mode-card:active { transform: scale(.95); }
    .mode-card-icon  { font-size: 52px; line-height: 1; }
    .mode-card-text  { text-align: left; }
    .mode-card-label { font-size: 26px; font-weight: 900; color: #1A202C; }
    .mode-card-sub   { font-size: 14px; font-weight: 700; color: #718096; }
    .mode-card--letters { border-left: 8px solid #A78BFA; }
    .mode-card--numbers { border-left: 8px solid #4ECDC4; }
    .mode-card--mix     { border-left: 8px solid #FB923C; }
    .mode-card--print   { border-left: 8px solid #A78BFA; }
    .mode-card--cursive { border-left: 8px solid #FB923C; }

    #screen-game {
      display: none; flex: 1; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; width: 100%; padding: 80px 20px 24px;
    }
    .trace-header {
      display: flex; align-items: center; gap: 16px;
    }
    .trace-prompt {
      font-size: 22px; font-weight: 900; color: white;
      text-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    .trace-area {
      position: relative; width: 260px; height: 260px;
    }
    .check-flash {
      position: absolute; inset: 0; display: flex;
      align-items: center; justify-content: center;
      font-size: 130px; pointer-events: none; opacity: 0;
      transition: opacity .15s;
    }
    .check-flash.show { opacity: 1; animation: bounce-in .4s cubic-bezier(.34,1.56,.64,1); }

    .progress-track {
      width: 220px; height: 18px; border-radius: 100px;
      background: rgba(255,255,255,.4); overflow: hidden;
    }
    .progress-fill {
      height: 100%; width: 0%; background: var(--green);
      border-radius: 100px; transition: width .15s;
    }
    .clear-btn {
      background: rgba(255,255,255,.3); border: none; border-radius: 14px;
      padding: 12px 28px; font-family: inherit; font-size: 18px; font-weight: 900;
      color: white; cursor: pointer; backdrop-filter: blur(8px);
      transition: transform .1s;
    }
    .clear-btn:active { transform: scale(.92); }
  </style>
</head>

    function drawArrows(ctx, arrowList, color, scale) {
      const headLen = 12 * scale;
      const lineLen = 8 * scale;
      const lineWidth = 2;

      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = lineWidth;

      arrowList.forEach(([x, y, angleDeg]) => {
        const angleRad = (angleDeg * Math.PI) / 180;

        const tipX = x + Math.cos(angleRad) * headLen;
        const tipY = y + Math.sin(angleRad) * headLen;
        const leftX = x + Math.cos(angleRad + 2.5) * headLen * 0.5;
        const leftY = y + Math.sin(angleRad + 2.5) * headLen * 0.5;
        const rightX = x + Math.cos(angleRad - 2.5) * headLen * 0.5;
        const rightY = y + Math.sin(angleRad - 2.5) * headLen * 0.5;

        ctx.beginPath();
        ctx.moveTo(tipX, tipY);
        ctx.lineTo(leftX, leftY);
        ctx.lineTo(rightX, rightY);
        ctx.closePath();
        ctx.fill();

        const tailX = x - Math.cos(angleRad) * lineLen;
        const tailY = y - Math.sin(angleRad) * lineLen;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(tailX, tailY);
        ctx.stroke();
      });
    }

    function drawCursiveLetterPath(ctx, char, options) {
      const charData = letterPaths[char];
      if (!charData || !charData.cursive) return;

      const { strokes } = charData.cursive;
      const { fillStyle = '#000', strokeStyle = '#000', lineWidth = 12 } = options;

      ctx.strokeStyle = strokeStyle;
      ctx.fillStyle = fillStyle;
      ctx.lineWidth = lineWidth;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      strokes.forEach(stroke => {
        const { points } = stroke;
        if (points.length === 0) return;
        ctx.beginPath();
        ctx.moveTo(points[0][0], points[0][1]);
        for (let i = 1; i < points.length; i++) {
          ctx.lineTo(points[i][0], points[i][1]);
        }
        ctx.stroke();
      });
    }

    function drawGuideCursive(char) {
      const gctx = guideCanvas.getContext('2d');
      gctx.clearRect(0, 0, 260, 260);

      const charData = letterPaths[char];
      if (charData && charData.cursive && charData.cursive.strokes) {
        drawCursiveLetterPath(gctx, char, { strokeStyle: '#E8E8E8', fillStyle: '#E8E8E8', lineWidth: 14 });

        const arrowColor = '#4ECDC4';
        if (charData.cursive.arrows) {
          drawArrows(gctx, charData.cursive.arrows, arrowColor, 0.7);
        }
      } else {
        gctx.font = '900 190px Arial, sans-serif';
        gctx.textAlign = 'center';
        gctx.textBaseline = 'middle';
        gctx.fillStyle = '#E8E8E8';
        gctx.fillText(char, 130, 130);
        gctx.strokeStyle = '#D0D0D0';
        gctx.lineWidth = 3;
        gctx.strokeText(char, 130, 130);
      }
    }

    function extractCellsFromCursive(char) {
      const oc = document.createElement('canvas');
      oc.width = 260; oc.height = 260;
      const octx = oc.getContext('2d');

      const charData = letterPaths[char];
      if (charData && charData.cursive && charData.cursive.strokes) {
        drawCursiveLetterPath(octx, char, { strokeStyle: '#000', fillStyle: '#000', lineWidth: 14 });
      } else {
        octx.font = '900 190px Arial, sans-serif';
        octx.textAlign = 'center';
        octx.textBaseline = 'middle';
        octx.fillStyle = '#000';
        octx.fillText(char, 130, 130);
      }

      const data = octx.getImageData(0, 0, 260, 260).data;
      const cells = new Set();
      for (let gy = 0; gy < Math.ceil(260 / GRID); gy++) {
        for (let gx = 0; gx < Math.ceil(260 / GRID); gx++) {
          let found = false;
          for (let dy = 0; dy < GRID && !found; dy++) {
            for (let dx = 0; dx < GRID && !found; dx++) {
              const px = gx * GRID + dx, py = gy * GRID + dy;
              if (px < 260 && py < 260 && data[(py * 260 + px) * 4 + 3] > 60) found = true;
            }
          }
          if (found) cells.add(`${gx},${gy}`);
        }
      }
      return cells;
    }

    class TracingGame extends KidsGame {
      init() {
        document.querySelectorAll('#style-cards .mode-card').forEach(btn =>
          btn.addEventListener('click', () => { this._ctx(); onStyleSelect(btn.dataset.style); }));
        document.querySelectorAll('#screen-difficulty .mode-card').forEach(btn =>

        clearBtn.addEventListener('click', clearDrawing);
        backBtn.addEventListener('click', () => {
          if (screenGame.style.display !== 'none') showStyleSelect();
          else if (screenDifficulty.style.display !== 'none') showStyleSelect();
          else this.home();
        });
        bindDrawing();
      }
    }

    function onStyleSelect(style) {
      currentStyle = style;

      screenDifficulty.style.display = 'flex';

    function showStyleSelect() {
      screenGame.style.display = 'none';

      screenMode.style.display = 'flex';
    }

    function startGame(styleKey, modeKey) {
      currentStyle = styleKey;
      currentMode = modeKey;
      const pool = modeKey === 'letters' ? [...LETTERS]
                 : modeKey === 'numbers' ? [...NUMBERS]
                 : [...LETTERS, ...NUMBERS];
      session = shuffle(pool).map(char => {
        if (modeKey === 'numbers' || !LETTERS.includes(char)) {
          return { char, style: 'print' };
        }
        if (styleKey === 'mix') {
          return { char, style: Math.random() < 0.5 ? 'print' : 'cursive' };
        }
        return { char, style: styleKey };
      }).slice(0, SESSION_LEN);
      charIndex = 0;
      clears = 0;
      screenMode.style.display = 'none';
      screenDifficulty.style.display = 'none';
      screenGame.style.display = 'flex';
      renderDots();
      loadChar(session[0]);
    }

    function renderDots() {
      dotsEl.innerHTML = '';
      for (let i = 0; i < SESSION_LEN; i++) {
        const d = document.createElement('div');
        d.className = 'dot' + (i < charIndex ? ' done' : i === charIndex ? ' current' : '');
        dotsEl.appendChild(d);
      }
    }

    function loadChar(charObj) {
      locked = false;
      coveredCells = new Set();
      drawCtx.clearRect(0, 0, 260, 260);
      progressFill.style.width = '0%';
      checkFlash.classList.remove('show');

      const char = charObj.char;
      currentLetterStyle = charObj.style;

      if (currentLetterStyle === 'cursive' && LETTERS.includes(char)) {
        drawGuideCursive(char);
        letterCells = extractCellsFromCursive(char);
      } else {
        const gctx = guideCanvas.getContext('2d');
        gctx.clearRect(0, 0, 260, 260);
        gctx.font = '900 190px Arial, sans-serif';
        gctx.textAlign = 'center';
        gctx.textBaseline = 'middle';
        gctx.fillStyle = '#E8E8E8';
        gctx.fillText(char, 130, 130);
        gctx.strokeStyle = '#D0D0D0';
        gctx.lineWidth = 3;
        gctx.strokeText(char, 130, 130);

        if (letterPaths[char] && letterPaths[char].print.arrows.length > 0) {
          drawArrows(gctx, letterPaths[char].print.arrows, '#4ECDC4', 0.7);
        }

        letterCells = buildLetterMap(char);
      }
    }

    function buildLetterMap(char) {
      const oc = document.createElement('canvas');
      oc.width = 260; oc.height = 260;
      const octx = oc.getContext('2d');
      octx.font = '900 190px Arial, sans-serif';
      octx.textAlign = 'center';
      octx.textBaseline = 'middle';
      octx.fillStyle = '#000';
      octx.fillText(char, 130, 130);

      const data = octx.getImageData(0, 0, 260, 260).data;
      const cells = new Set();
      for (let gy = 0; gy < Math.ceil(260 / GRID); gy++) {
        for (let gx = 0; gx < Math.ceil(260 / GRID); gx++) {
          let found = false;
          for (let dy = 0; dy < GRID && !found; dy++) {
            for (let dx = 0; dx < GRID && !found; dx++) {
              const px = gx * GRID + dx, py = gy * GRID + dy;
              if (px < 260 && py < 260 && data[(py * 260 + px) * 4 + 3] > 60) found = true;
            }
          }
          if (found) cells.add(`${gx},${gy}`);
        }
      }
      return cells;
    }

    function canvasXY(e) {
      const r = drawCanvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return [
        (t.clientX - r.left) * (260 / r.width),
        (t.clientY - r.top)  * (260 / r.height),
      ];
    }

    function startStroke(x, y) {
      if (locked) return;
      drawing = true;
      lastX = x; lastY = y;
      onMove(x, y);
    }

    function onMove(x, y) {
      if (!drawing || locked) return;
      drawCtx.beginPath();
      drawCtx.moveTo(lastX ?? x, lastY ?? y);
      drawCtx.lineTo(x, y);
      drawCtx.stroke();
      lastX = x; lastY = y;
      checkCoverage(x, y);
    }

    function endStroke() {
      drawing = false;
      lastX = null; lastY = null;
    }

    function checkCoverage(x, y) {
      const gx = Math.floor(x / GRID);
      const gy = Math.floor(y / GRID);
      let newCells = false;
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          const key = `${gx + dc},${gy + dr}`;
          if (letterCells.has(key) && !coveredCells.has(key)) {
            coveredCells.add(key);
            newCells = true;
          }
        }
      }
      if (newCells) {
        game.sound('pop');
        updateProgress();
      }
      if (!locked && coveredCells.size / letterCells.size >= COVER_TARGET) onCharComplete();
    }

    function updateProgress() {
      const pct = Math.min(1, coveredCells.size / letterCells.size);
      progressFill.style.width = (pct * 100) + '%';
    }

    function onCharComplete() {
      locked = true;
      drawing = false;
      game.sound('correct');
      checkFlash.classList.add('show');
      setTimeout(() => {
        charIndex++;
        renderDots();
        if (charIndex >= session.length) {
          const stars = clears <= 1 ? 3 : clears <= 4 ? 2 : 1;
          game.showWin(stars, cb => { if (cb === 'again') startGame(currentStyle, currentMode); });
        } else {
          loadChar(session[charIndex]);
        }
      }, 900);
    }

    function clearDrawing() {
      drawCtx.clearRect(0, 0, 260, 260);
      coveredCells = new Set();
      clears++;
      updateProgress();
      game.sound('click');
    }

    function bindDrawing() {
      drawCanvas.addEventListener('touchstart', e => {
        e.preventDefault();
        game._ctx();
        const [x, y] = canvasXY(e);
        startStroke(x, y);
      }, { passive: false });
      drawCanvas.addEventListener('touchmove', e => {
        e.preventDefault();
        const [x, y] = canvasXY(e);
        onMove(x, y);
      }, { passive: false });
      drawCanvas.addEventListener('touchend', e => { e.preventDefault(); endStroke(); }, { passive: false });
      drawCanvas.addEventListener('touchcancel', endStroke);

      drawCanvas.addEventListener('mousedown', e => {
        game._ctx();
        const [x, y] = canvasXY(e);
        startStroke(x, y);
      });
      drawCanvas.addEventListener('mousemove', e => {
        const [x, y] = canvasXY(e);
        onMove(x, y);
      });
      window.addEventListener('mouseup', endStroke);
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    document.addEventListener('DOMContentLoaded', () => {
      game = new TracingGame({ name: 'Tracing' });
      game.init();
    });
  </script>
</body>
</html>
