<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Games</title>
  <link rel="stylesheet" href="/css/kids.css">
  <style>
    body { overflow-y: auto; }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      padding: 0 20px 32px;
      max-width: 860px;
      margin: 0 auto;
      width: 100%;
    }

    .game-card { position: relative; }

    .game-card.coming-soon {
      opacity: .65;
      cursor: default;
    }
    .game-card.coming-soon:active { transform: none; }

    .coming-tag {
      position: absolute; top: 12px; right: 12px;
      background: #EDF2F7; color: var(--mid);
      font-size: 11px; font-weight: 800;
      padding: 3px 8px; border-radius: 8px;
      text-transform: uppercase; letter-spacing: .5px;
    }
  </style>
</head>
<body>
  <button class="nav-back" onclick="location.href='/'">🏠</button>
  <h1 class="page-title">Games 🎮</h1>

  <div class="games-grid">
    <a href="/games/spelling/" class="card game-card">
      <span class="card-icon">📝</span>
      <span class="card-title">Spelling</span>
      <span class="card-desc">Letters & words</span>
      <span class="badge badge-all">4 – 7 yrs</span>
    </a>

    <div class="card game-card coming-soon">
      <span class="coming-tag">Soon</span>
      <span class="card-icon">🎨</span>
      <span class="card-title">Colouring</span>
      <span class="card-desc">Paint & draw</span>
      <span class="badge badge-4">4+ yrs</span>
    </div>

    <div class="card game-card coming-soon">
      <span class="coming-tag">Soon</span>
      <span class="card-icon">🧱</span>
      <span class="card-title">Blocks</span>
      <span class="card-desc">Stack & build</span>
      <span class="badge badge-4">4+ yrs</span>
    </div>

    <div class="card game-card coming-soon">
      <span class="coming-tag">Soon</span>
      <span class="card-icon">🃏</span>
      <span class="card-title">Uno</span>
      <span class="card-desc">Card game</span>
      <span class="badge badge-6">6+ yrs</span>
    </div>
  </div>
</body>
</html>
