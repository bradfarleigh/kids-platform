<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Word Chain</title>
  <link rel="stylesheet" href="../../css/kids.css">
  <style>
    body { background: linear-gradient(160deg, #fddb92 0%, #a8e6cf 100%); }

    #screen-mode {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; gap: 24px; padding: 80px 20px 32px;
      overflow-y: auto; width: 100%;
    }
    .mode-title {
      font-size: clamp(32px, 7vw, 56px); font-weight: 900;
      color: #1A202C; text-shadow: 0 2px 8px rgba(255,255,255,.4);
    }
    .mode-cards {
      display: grid; grid-template-columns: 1fr 1fr; gap: 18px;
      width: 100%; max-width: 500px;
    }
    .mode-card {
      background: white; border-radius: 24px; padding: 24px 14px;
      text-align: center; cursor: pointer; box-shadow: 0 8px 32px rgba(0,0,0,.12);
      transition: transform .15s cubic-bezier(.34,1.56,.64,1);
      display: flex; flex-direction: column; gap: 8px; align-items: center;
      border: none; font-family: inherit;
    }
    .mode-card:active { transform: scale(.93); }
    .mode-card-icon  { font-size: clamp(40px, 9vw, 60px); line-height: 1; }
    .mode-card-label { font-size: clamp(20px, 4.5vw, 28px); font-weight: 900; color: #1A202C; }
    .mode-card-sub   { font-size: 13px; font-weight: 700; color: #718096; }

    #screen-game { display: none; flex: 1; flex-direction: column; align-items: center; width: 100%; }

    .chain-header {
      width: 100%; padding: 72px 24px 12px;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .chain-score {
      font-size: 20px; font-weight: 900; color: #1A202C;
      display: flex; align-items: center; gap: 6px;
    }

    .chain-content {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: clamp(16px, 3vh, 28px);
      padding: 0 20px 24px; width: 100%; max-width: 600px;
    }

    .chain-prompt {
      font-size: clamp(18px, 4vw, 26px); font-weight: 800; color: #1A202C;
      text-align: center;
    }

    .hear-btn {
      background: white; border: none; border-radius: 100px;
      padding: 14px 28px; font-size: clamp(18px, 4vw, 24px); font-weight: 900;
      color: #1A202C; cursor: pointer; font-family: inherit;
      box-shadow: 0 6px 20px rgba(0,0,0,.12);
      display: flex; align-items: center; gap: 10px;
      transition: transform .12s;
    }
    .hear-btn:active { transform: scale(.93); }

    .word-row { display: flex; gap: 10px; justify-content: center; flex-wrap: nowrap; }
    .slot {
      height: clamp(52px, 9vw, 80px); min-width: clamp(52px, 9vw, 80px);
      width: auto; padding: 0 10px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(26px, 5vw, 44px); font-weight: 900; color: #1A202C;
      background: rgba(255,255,255,.85);
      transition: transform .2s, background .2s;
    }
    .slot.gap {
      background: rgba(255,255,255,.25);
      border: 3px dashed rgba(0,0,0,.3); color: transparent;
    }
    .slot.filled {
      background: #6BCB77; color: white; border: 3px solid transparent;
    }

    .choices { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .tile {
      height: clamp(52px, 9vw, 80px); min-width: clamp(52px, 9vw, 80px);
      width: auto; padding: 0 10px; border-radius: 14px;
      font-size: clamp(26px, 5vw, 44px); font-weight: 900;
      border: none; cursor: pointer; font-family: inherit;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 12px rgba(0,0,0,.2);
      transition: transform .1s, opacity .2s;
    }
    .tile:active { transform: scale(.9); }
    .tile:disabled { opacity: .35; }
  </style>
</head>
<body>
  <button class="nav-back" id="back-btn">🏠</button>

  <div id="screen-mode">
    <h1 class="mode-title">Word Chain 🔗</h1>
    <div class="mode-cards" id="chain-cards"></div>
  </div>

  <div id="screen-game">
    <div class="chain-header">
      <div class="progress-dots" id="progress"></div>
      <div class="chain-score">⭐ <span id="score-val">0</span></div>
    </div>
    <div class="chain-content">
      <div class="chain-prompt">Change ONE tile to make the next word!</div>
      <button class="hear-btn" id="hear-btn">🔊 Hear the next word</button>
      <div class="word-row" id="word-row"></div>
      <div class="choices" id="choices"></div>
    </div>
  </div>

  <script src="../_lib/confetti.js"></script>
  <script src="../_lib/KidsGame.js"></script>
  <script src="../_lib/words-au.js"></script>
  <script>
    const VOWELS = ['a','e','i','o','u','ar','or','er','ir','ur','ai','ay','ee','ea','oa','ow','oo'];
    const CONS   = ['b','c','d','f','g','h','j','k','l','m','n','p','r','s','t','v','w','y','z','ck','ll','ss','ff','sh','ch','th','ng'];
    const COLOURS = ['#6BCB77','#FB923C','#A78BFA','#4ECDC4','#FF6B6B','#FFE66D'];

    let game, chain, steps, stepIndex, score, mistakes;
    let targetG, gapIndex, answered;

    const screenMode = document.getElementById('screen-mode');
    const screenGame = document.getElementById('screen-game');
    const progressEl = document.getElementById('progress');
    const scoreEl    = document.getElementById('score-val');
    const wordRow    = document.getElementById('word-row');
    const choicesEl  = document.getElementById('choices');
    const hearBtn    = document.getElementById('hear-btn');
    const backBtn    = document.getElementById('back-btn');

    class ChainGame extends KidsGame {
      init() {
        buildChainCards();
        hearBtn.addEventListener('click', () => { this._ctx(); AU.speak(steps[stepIndex + 1]); });
        backBtn.addEventListener('click', () => {
          if (screenGame.style.display !== 'none') showChainSelect();
          else this.home();
        });
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      game = new ChainGame({ name: 'Word Chain' });
      game.init();
    });

    function buildChainCards() {
      const el = document.getElementById('chain-cards');
      el.innerHTML = '';
      AU.CHAINS.forEach((c, i) => {
        const btn = document.createElement('button');
        btn.className = 'mode-card';
        btn.style.borderTop = `6px solid ${COLOURS[i % COLOURS.length]}`;
        btn.innerHTML = `
          <span class="mode-card-icon">${c.icon}</span>
          <span class="mode-card-label">${c.title}</span>
          <span class="mode-card-sub">Ages ${c.ages} • ${c.steps.length} words</span>`;
        btn.addEventListener('click', () => { game._ctx(); startChain(c); });
        el.appendChild(btn);
      });
    }

    function startChain(c) {
      chain = c;
      steps = c.steps.map(AU.segment);
      stepIndex = 0;
      score = 0;
      mistakes = 0;
      scoreEl.textContent = '0';
      screenMode.style.display = 'none';
      screenGame.style.display = 'flex';
      renderProgress();
      renderStep();
    }

    function showChainSelect() {
      screenGame.style.display = 'none';
      screenMode.style.display = 'flex';
    }

    function renderProgress() {
      progressEl.innerHTML = '';
      for (let i = 0; i < steps.length - 1; i++) {
        const d = document.createElement('div');
        d.className = 'dot' + (i < stepIndex ? ' done' : i === stepIndex ? ' current' : '');
        progressEl.appendChild(d);
      }
    }

    // Find the single grapheme position that changes between the two steps.
    function diffIndex(a, b) {
      if (a.length !== b.length) return -1;
      const diffs = [];
      for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) diffs.push(i);
      return diffs.length === 1 ? diffs[0] : -1;
    }

    function makeChoices(answer, cur, gi) {
      const pool = VOWELS.includes(answer) ? VOWELS : CONS;
      const out = [answer];
      for (const c of AU.shuffle([...pool])) {
        if (out.length === 4) break;
        if (c === answer || out.includes(c)) continue;
        const cand = cur.map((g, i) => i === gi ? c : g).join('');
        if (AU.VALID.has(cand) || AU.BLOCKED.has(cand)) continue;
        out.push(c);
      }
      return AU.shuffle(out);
    }

    function renderStep() {
      const cur = steps[stepIndex];
      const nxt = steps[stepIndex + 1];
      gapIndex = diffIndex(cur, nxt);
      targetG = nxt[gapIndex];
      answered = false;

      wordRow.innerHTML = '';
      cur.forEach((g, i) => {
        const slot = document.createElement('div');
        slot.className = 'slot' + (i === gapIndex ? ' gap' : '');
        slot.textContent = i === gapIndex ? '' : g;
        wordRow.appendChild(slot);
      });

      choicesEl.innerHTML = '';
      makeChoices(targetG, cur, gapIndex).forEach((c, i) => {
        const t = document.createElement('button');
        t.className = `tile tc${i % 6}`;
        t.textContent = c;
        t.dataset.g = c;
        t.addEventListener('click', () => tapChoice(t));
        choicesEl.appendChild(t);
      });

      setTimeout(() => AU.speak(steps[stepIndex + 1]), 400);
    }

    function tapChoice(tile) {
      game._ctx();
      if (answered || tile.disabled) return;
      if (tile.dataset.g === targetG) {
        answered = true;
        const slot = wordRow.children[gapIndex];
        slot.textContent = targetG;
        slot.classList.remove('gap');
        slot.classList.add('filled');
        game.sound('correct');
        AU.speak(chain.steps[stepIndex + 1]);
        score += 10;
        scoreEl.textContent = score;
        setTimeout(() => {
          stepIndex++;
          renderProgress();
          if (stepIndex >= steps.length - 1) finish();
          else renderStep();
        }, 1300);
      } else {
        game.wrong(tile);
        mistakes++;
      }
    }

    function finish() {
      const stars = mistakes <= 1 ? 3 : mistakes <= 4 ? 2 : 1;
      KidsGame.saveResult('wordchain', { score, stars });
      game.showWin(stars, action => { if (action === 'again') startChain(chain); });
    }
  </script>
</body>
</html>
