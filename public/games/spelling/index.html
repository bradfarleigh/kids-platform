<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Spelling</title>
  <link rel="stylesheet" href="../../css/kids.css">
  <style>
    body {
      background: linear-gradient(160deg, #74ebd5 0%, #9face6 100%);
    }

    /* ── Stage select screen ────────────────────────────────────── */
    #screen-mode {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; gap: 24px; padding: 80px 20px 32px;
      overflow-y: auto; width: 100%;
    }
    .mode-title {
      font-size: clamp(32px, 7vw, 60px); font-weight: 900;
      color: white; text-shadow: 0 3px 12px rgba(0,0,0,.2);
    }
    .mode-cards {
      display: grid; grid-template-columns: 1fr 1fr; gap: 18px;
      width: 100%; max-width: 500px;
    }
    .mode-card {
      background: white; border-radius: 24px; padding: 24px 14px;
      text-align: center; cursor: pointer; box-shadow: 0 8px 32px rgba(0,0,0,.12);
      transition: transform .15s cubic-bezier(.34,1.56,.64,1);
      display: flex; flex-direction: column; gap: 8px; align-items: center;
      border: none; font-family: inherit;
    }
    .mode-card:active { transform: scale(.93); }
    .mode-card-icon  { font-size: clamp(40px, 9vw, 60px); line-height: 1; }
    .mode-card-label { font-size: clamp(20px, 4.5vw, 28px); font-weight: 900; color: #1A202C; }
    .mode-card-sub   { font-size: 13px; font-weight: 700; color: #718096; }

    /* ── Game screen ────────────────────────────────────────────── */
    #screen-game { display: none; flex: 1; flex-direction: column; align-items: center; width: 100%; }

    .spell-header {
      width: 100%; padding: 72px 24px 12px;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .spell-score {
      font-size: 20px; font-weight: 900; color: white;
      display: flex; align-items: center; gap: 6px;
    }

    .spell-content {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: clamp(12px, 2.5vh, 24px);
      padding: 0 20px 24px; width: 100%; max-width: 680px;
    }

    /* Word hint (big emoji) */
    .word-emoji {
      font-size: clamp(72px, 15vw, 120px);
      line-height: 1;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,.15));
      transition: transform .2s;
      cursor: pointer; background: none; border: none;
    }
    .word-emoji.bounce { animation: bounce-in .4s cubic-bezier(.34,1.56,.64,1); }

    /* Grapheme slots */
    .slots {
      display: flex; gap: clamp(8px, 1.5vw, 14px);
      justify-content: center; flex-wrap: nowrap;
    }
    .slot {
      height: clamp(52px, 9vw, 80px);
      min-width: clamp(52px, 9vw, 80px);
      width: auto; padding: 0 10px;
      border-radius: 14px;
      border: 3px dashed rgba(255,255,255,.6);
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(26px, 5vw, 44px);
      font-weight: 900; color: white;
      transition: transform .2s, background .2s;
      background: rgba(255,255,255,.15);
    }
    .slot.filled {
      background: #6BCB77;
      border: 3px solid transparent;
      transform: scale(1.08);
      color: white;
    }

    /* Grapheme tiles */
    .tiles {
      display: flex; gap: clamp(8px, 1.5vw, 14px);
      justify-content: center; flex-wrap: wrap;
    }
    .tile {
      height: clamp(56px, 9.5vw, 84px);
      padding: 0 14px;
      border-radius: 14px;
      font-size: clamp(28px, 5.5vw, 48px);
      font-weight: 900;
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 12px rgba(0,0,0,.2);
      transition: transform .1s, opacity .2s;
      font-family: inherit;
    }
    .tile:active { transform: scale(.9); }
    .tile[disabled] { opacity: 0; pointer-events: none; }

    /* Type mode */
    .speaker-btn {
      width: 96px; height: 96px; border-radius: 50%;
      background: rgba(255,255,255,.3); border: none;
      font-size: 44px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform .1s;
    }
    .speaker-btn:active { transform: scale(.92); }

    .type-boxes {
      display: flex; gap: clamp(6px, 1.4vw, 12px);
      justify-content: center; flex-wrap: wrap;
    }
    .type-box {
      width: clamp(38px, 8vw, 56px);
      height: clamp(50px, 9vw, 70px);
      border-radius: 12px;
      border: 3px dashed rgba(255,255,255,.6);
      background: rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(22px, 4.5vw, 36px); font-weight: 900; color: white;
    }
    .type-box.ghost { color: rgba(0,0,0,.25); }
    .type-box.good { background: #6BCB77; color: white; border-style: solid; border-color: transparent; }
    .type-box.bad  { background: #FF6B6B; color: white; border-style: solid; border-color: transparent; }

    .kb { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 520px; }
    .kb-row { display: flex; gap: 6px; justify-content: center; }
    .kb-key {
      flex: 1; max-width: 48px; height: 52px; border-radius: 10px; border: none;
      background: white; color: #1A202C; font-family: inherit; font-size: 20px;
      font-weight: 900; cursor: pointer;
    }
    .kb-key:active { transform: scale(.9); }
    .kb-key.wide { max-width: 72px; }
    .kb-key.enter { background: var(--green); color: white; }
    .kb-key.enter[disabled] { opacity: .4; cursor: default; }

    /* Word complete flash */
    .word-done-flash {
      position: fixed; inset: 0; z-index: 500;
      display: flex; align-items: center; justify-content: center;
      background: rgba(107,203,119,.85);
      font-size: 80px;
      animation: flash-in .25s ease;
      pointer-events: none;
    }
    @keyframes flash-in {
      from { opacity: 0; transform: scale(.5); }
      to   { opacity: 1; transform: scale(1); }
    }

    .hint-btn {
      background: rgba(255,255,255,.25); border: none; border-radius: 14px;
      padding: 10px 20px; font-family: inherit; font-size: 16px; font-weight: 800;
      color: white; cursor: pointer; backdrop-filter: blur(8px);
      transition: opacity .2s;
    }
    .hint-btn:active { opacity: .7; }

    /* ── Stage 1: tracing ───────────────────────────────────────── */
    .trace-area { position: relative; width: 260px; height: 260px; }
    .check-flash {
      position: absolute; inset: 0; display: flex;
      align-items: center; justify-content: center;
      font-size: 130px; pointer-events: none; opacity: 0;
    }
    .check-flash.show { opacity: 1; animation: bounce-in .4s cubic-bezier(.34,1.56,.64,1); }
    .progress-track {
      width: 220px; height: 18px; border-radius: 100px;
      background: rgba(255,255,255,.4); overflow: hidden;
    }
    .progress-fill {
      height: 100%; width: 0%; background: var(--green);
      border-radius: 100px; transition: width .15s;
    }
    .clear-btn {
      background: rgba(255,255,255,.3); border: none; border-radius: 14px;
      padding: 12px 28px; font-family: inherit; font-size: 18px; font-weight: 900;
      color: white; cursor: pointer; backdrop-filter: blur(8px);
      transition: transform .1s;
    }
    .clear-btn:active { transform: scale(.92); }
  </style>
</head>
<body>
  <button class="nav-back" id="back-btn">←</button>

  <!-- Stage selection -->
  <div id="screen-mode">
    <div class="mode-title">Spelling 📝</div>
    <div class="mode-cards" id="stage-cards"></div>
  </div>

  <!-- Game play -->
  <div id="screen-game">
    <div class="spell-header">
      <div class="progress-dots" id="progress"></div>
      <div class="spell-score" id="score-box">⭐ <span id="score-val">0</span></div>
    </div>

    <!-- Tile mode -->
    <div class="spell-content" id="tile-content">
      <button class="word-emoji" id="word-emoji"></button>
      <div class="slots" id="slots"></div>
      <div class="tiles" id="tiles"></div>
      <button class="hint-btn" id="hint-btn">💡 Hint</button>
    </div>

    <!-- Trace mode -->
    <div class="spell-content" id="trace-content" style="display:none">
      <div class="trace-area">
        <canvas id="guide-canvas" width="260" height="260"
                style="position:absolute;top:0;left:0;border-radius:20px;background:white;box-shadow:0 8px 32px rgba(0,0,0,.12)"></canvas>
        <canvas id="draw-canvas" width="260" height="260"
                style="position:absolute;top:0;left:0;border-radius:20px;background:transparent;touch-action:none"></canvas>
        <div class="check-flash" id="check-flash">✓</div>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <button class="clear-btn" id="clear-btn">Clear ✏️</button>
    </div>

    <!-- Type mode -->
    <div class="spell-content" id="type-content" style="display:none">
      <button class="speaker-btn" id="speaker-btn">🔊</button>
      <div class="type-boxes" id="type-boxes"></div>
      <div class="kb" id="kb"></div>
    </div>
  </div>

  <script src="../_lib/confetti.js"></script>
  <script src="../_lib/KidsGame.js"></script>
  <script src="../_lib/words-au.js"></script>
  <script>
    const WORDS_PER_GAME = 5;
    const STAGE_COLOURS = ['#6BCB77','#4ECDC4','#FB923C','#A78BFA','#FF6B6B','#FFE66D','#F9A8D4'];

    // ── Game state ────────────────────────────────────────────────
    let game, currentStage, roundWords, wordIndex, totalMistakes;
    let currentWordObj, currentWord, currentGraphemes, currentSlot, wrongOnSlot, mistakesThisWord;
    let typeActive = false, inputLocked = false, typed = [], attempts = 0, showGhost = false;

    // ── DOM refs ──────────────────────────────────────────────────
    const screenMode   = document.getElementById('screen-mode');
    const screenGame   = document.getElementById('screen-game');
    const stageCardsEl = document.getElementById('stage-cards');
    const progressEl   = document.getElementById('progress');
    const scoreEl      = document.getElementById('score-val');
    const scoreBox     = document.getElementById('score-box');
    const tileContent  = document.getElementById('tile-content');
    const traceContent = document.getElementById('trace-content');
    const typeContent  = document.getElementById('type-content');
    const emojiEl      = document.getElementById('word-emoji');
    const slotsEl      = document.getElementById('slots');
    const tilesEl      = document.getElementById('tiles');
    const hintBtn      = document.getElementById('hint-btn');
    const speakerBtn   = document.getElementById('speaker-btn');
    const typeBoxesEl  = document.getElementById('type-boxes');
    const kbEl         = document.getElementById('kb');
    const backBtn      = document.getElementById('back-btn');

    // ── Init ──────────────────────────────────────────────────────
    class SpellingGame extends KidsGame {
      init() {
        buildStageCards();
        emojiEl.addEventListener('click', () => { this._ctx(); AU.speak(currentWord); });
        hintBtn.addEventListener('click', showTileHint);
        speakerBtn.addEventListener('click', () => { this._ctx(); speakDictation(); });
        buildKeyboard();
        document.addEventListener('keydown', e => {
          if (!typeActive || inputLocked) return;
          if (/^[a-z]$/i.test(e.key)) handleKey(e.key.toLowerCase());
          else if (e.key === 'Backspace') handleBackspace();
          else if (e.key === 'Enter') submitType();
        });
        backBtn.addEventListener('click', () => {
          if (screenGame.style.display !== 'none') showStageSelect();
          else this.home();
        });
        bindTracing();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      game = new SpellingGame({ name: 'Spelling' });
      game.init();
    });

    function buildStageCards() {
      stageCardsEl.innerHTML = '';
      const last = localStorage.getItem('au-spelling-stage');
      AU.STAGES.forEach((s, i) => {
        const btn = document.createElement('button');
        btn.className = 'mode-card';
        btn.style.borderTop = `6px solid ${STAGE_COLOURS[i]}`;
        if (String(s.id) === last) {
          btn.style.boxShadow = '0 0 0 4px var(--yellow), 0 8px 32px rgba(0,0,0,.12)';
        }
        btn.innerHTML = `
          <span class="mode-card-icon">${s.icon}</span>
          <span class="mode-card-label">${s.label}</span>
          <span class="mode-card-sub">Ages ${s.ages} • ${s.sub}</span>`;
        btn.addEventListener('click', () => { game._ctx(); startStage(s); });
        stageCardsEl.appendChild(btn);
      });
    }

    // ── Game flow ─────────────────────────────────────────────────
    function startStage(stage) {
      currentStage = stage;
      localStorage.setItem('au-spelling-stage', String(stage.id));
      screenMode.style.display = 'none';
      screenGame.style.display = 'flex';
      totalMistakes = 0;
      wordIndex = 0;
      scoreEl.textContent = '0';

      if (stage.mode === 'trace') {
        tileContent.style.display = 'none';
        traceContent.style.display = 'flex';
        typeContent.style.display = 'none';
        scoreBox.style.visibility = 'hidden';
        typeActive = false;
        startTracing();
        return;
      }

      scoreBox.style.visibility = 'visible';
      roundWords = buildRound(stage);

      if (stage.mode === 'tiles') {
        tileContent.style.display = 'flex';
        traceContent.style.display = 'none';
        typeContent.style.display = 'none';
        typeActive = false;
      } else {
        tileContent.style.display = 'none';
        traceContent.style.display = 'none';
        typeContent.style.display = 'flex';
        typeActive = true;
      }

      renderProgress();
      renderWord();
    }

    function showStageSelect() {
      typeActive = false;
      screenGame.style.display = 'none';
      screenMode.style.display = 'flex';
      buildStageCards();
    }

    function renderProgress() {
      progressEl.innerHTML = '';
      for (let i = 0; i < WORDS_PER_GAME; i++) {
        const d = document.createElement('div');
        d.className = 'dot' + (i < wordIndex ? ' done' : i === wordIndex ? ' current' : '');
        progressEl.appendChild(d);
      }
    }

    function renderWord() {
      currentWordObj = roundWords[wordIndex];
      currentWord = currentWordObj.w;
      mistakesThisWord = 0;
      if (currentStage.mode === 'tiles') renderTileWord(currentWordObj);
      else renderTypeWord(currentWordObj);
    }

    function advanceWord() {
      if (mistakesThisWord >= 2) addMissed(currentStage.id, currentWord);
      else removeMissed(currentStage.id, currentWord);

      wordIndex++;
      renderProgress();

      if (wordIndex >= WORDS_PER_GAME) {
        typeActive = false;
        const stars = totalMistakes <= 3 ? 3 : totalMistakes <= 7 ? 2 : 1;
        game.showWin(stars, action => { if (action === 'again') startStage(currentStage); });
      } else {
        renderWord();
      }
    }

    // ── Tile mode ─────────────────────────────────────────────────
    function renderTileWord(word) {
      currentGraphemes = word.g;
      currentSlot = 0;
      wrongOnSlot = 0;

      emojiEl.textContent = word.e;
      emojiEl.classList.remove('bounce');
      void emojiEl.offsetWidth;
      emojiEl.classList.add('bounce');

      slotsEl.innerHTML = '';
      word.g.forEach(() => {
        const slot = document.createElement('div');
        slot.className = 'slot';
        slotsEl.appendChild(slot);
      });

      const pool = AU.GPC[currentStage.id].cons.concat(AU.GPC[currentStage.id].vowels);
      const inWord = new Set(word.g);
      const distractors = [];
      for (const g of AU.shuffle([...pool])) {
        if (distractors.length === 3) break;
        if (inWord.has(g) || distractors.includes(g)) continue;
        distractors.push(g);
      }
      const allTiles = AU.shuffle([...word.g, ...distractors]);

      tilesEl.innerHTML = '';
      allTiles.forEach((g, i) => {
        const tile = document.createElement('button');
        tile.className = `tile tc${i % 6}`;
        tile.textContent = g;
        tile.dataset.g = g;
        tile.addEventListener('click', () => handleTileTap(tile));
        tilesEl.appendChild(tile);
      });

      setTimeout(() => AU.speak(word.w), 400);
    }

    function handleTileTap(tile) {
      if (tile.disabled) return;
      if (currentSlot >= currentGraphemes.length) return;
      game._ctx();

      if (tile.dataset.g === currentGraphemes[currentSlot]) {
        const slot = slotsEl.children[currentSlot];
        slot.textContent = tile.dataset.g;
        slot.classList.add('filled');
        clearTileHints();
        tile.disabled = true;
        game.sound('pop');
        currentSlot++;
        wrongOnSlot = 0;
        if (currentSlot === currentGraphemes.length) {
          setTimeout(completeTileWord, 300);
        }
      } else {
        game.wrong(tile);
        totalMistakes++;
        mistakesThisWord++;
        wrongOnSlot++;
        if (wrongOnSlot >= 2) showTileHint();
      }
    }

    function showTileHint() {
      clearTileHints();
      const needed = currentGraphemes[currentSlot];
      Array.from(tilesEl.children).forEach(t => {
        if (!t.disabled && t.dataset.g === needed) t.classList.add('kg-hint');
      });
    }

    function clearTileHints() {
      tilesEl.querySelectorAll('.kg-hint').forEach(t => t.classList.remove('kg-hint'));
    }

    async function completeTileWord() {
      const flash = document.createElement('div');
      flash.className = 'word-done-flash';
      flash.textContent = '🎉';
      document.body.appendChild(flash);
      game.sound('cheer');
      AU.speak(currentWord);

      const points = Math.max(10, 30 - totalMistakes * 3);
      scoreEl.textContent = parseInt(scoreEl.textContent) + points;

      await delay(900);
      flash.remove();
      advanceWord();
    }

    // ── Type mode ─────────────────────────────────────────────────
    function speakDictation() {
      AU.speak(`${currentWordObj.w}. ${currentWordObj.s} ${currentWordObj.w}.`);
    }

    function buildKeyboard() {
      const rows = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
      kbEl.innerHTML = '';

      const r1 = document.createElement('div');
      r1.className = 'kb-row';
      rows[0].split('').forEach(ch => r1.appendChild(letterKey(ch)));
      kbEl.appendChild(r1);

      const r2 = document.createElement('div');
      r2.className = 'kb-row';
      rows[1].split('').forEach(ch => r2.appendChild(letterKey(ch)));
      kbEl.appendChild(r2);

      const r3 = document.createElement('div');
      r3.className = 'kb-row';
      const back = document.createElement('button');
      back.className = 'kb-key wide';
      back.textContent = '⌫';
      back.addEventListener('click', () => { if (!inputLocked) handleBackspace(); });
      r3.appendChild(back);
      rows[2].split('').forEach(ch => r3.appendChild(letterKey(ch)));
      const enter = document.createElement('button');
      enter.className = 'kb-key wide enter';
      enter.id = 'kb-enter';
      enter.textContent = '✓';
      enter.disabled = true;
      enter.addEventListener('click', () => { if (!inputLocked) submitType(); });
      r3.appendChild(enter);
      kbEl.appendChild(r3);
    }

    function letterKey(ch) {
      const b = document.createElement('button');
      b.className = 'kb-key';
      b.textContent = ch;
      b.addEventListener('click', () => { if (!inputLocked) handleKey(ch); });
      return b;
    }

    function renderTypeWord(word) {
      attempts = 0;
      typed = [];
      showGhost = false;
      inputLocked = false;
      renderTypeBoxes();
      setTimeout(speakDictation, 400);
    }

    function renderTypeBoxes() {
      typeBoxesEl.innerHTML = '';
      for (let i = 0; i < currentWord.length; i++) {
        const box = document.createElement('div');
        box.className = 'type-box';
        if (i < typed.length) {
          box.textContent = typed[i];
        } else if (showGhost) {
          box.textContent = currentWord[i];
          box.classList.add('ghost');
        }
        typeBoxesEl.appendChild(box);
      }
      const enter = document.getElementById('kb-enter');
      if (enter) enter.disabled = typed.length < currentWord.length;
    }

    function handleKey(ch) {
      game._ctx();
      if (typed.length < currentWord.length) {
        typed.push(ch);
        game.sound('click');
        renderTypeBoxes();
      }
    }

    function handleBackspace() {
      if (typed.length > 0) {
        typed.pop();
        renderTypeBoxes();
      }
    }

    function submitType() {
      if (typed.length < currentWord.length) return;
      game._ctx();
      inputLocked = true;
      const guess = typed.join('');

      if (guess === currentWord) {
        Array.from(typeBoxesEl.children).forEach(b => { b.className = 'type-box good'; });
        game.sound('cheer');
        AU.speak(currentWord);
        const points = attempts === 0 ? 30 : attempts === 1 ? 20 : 10;
        scoreEl.textContent = parseInt(scoreEl.textContent) + points;
        mistakesThisWord = attempts;

        const flash = document.createElement('div');
        flash.className = 'word-done-flash';
        flash.textContent = '🎉';
        document.body.appendChild(flash);

        setTimeout(() => { flash.remove(); advanceWord(); }, 1200);
      } else {
        attempts++;
        totalMistakes++;
        mistakesThisWord = attempts;
        Array.from(typeBoxesEl.children).forEach((b, i) => {
          b.className = 'type-box ' + (typed[i] === currentWord[i] ? 'good' : 'bad');
        });
        if (attempts >= 2) showGhost = true;
        setTimeout(() => {
          typed = [];
          inputLocked = false;
          renderTypeBoxes();
          speakDictation();
        }, 1500);
      }
    }

    // ── Review queue (spaced retrieval) ───────────────────────────
    function getMissed() {
      try { return JSON.parse(localStorage.getItem('au-spelling-missed')) ?? {}; }
      catch { return {}; }
    }
    function saveMissed(m) { localStorage.setItem('au-spelling-missed', JSON.stringify(m)); }

    function addMissed(stageId, w) {
      const m = getMissed();
      const list = m[stageId] ?? [];
      if (!list.includes(w)) {
        list.push(w);
        while (list.length > 10) list.shift();
      }
      m[stageId] = list;
      saveMissed(m);
    }

    function removeMissed(stageId, w) {
      const m = getMissed();
      const list = m[stageId] ?? [];
      const idx = list.indexOf(w);
      if (idx !== -1) {
        list.splice(idx, 1);
        m[stageId] = list;
        saveMissed(m);
      }
    }

    function buildRound(stage) {
      const missed = (getMissed()[stage.id] ?? []).filter(w => stage.words.some(x => x.w === w));
      const missedWords = [];
      for (const w of missed) {
        if (missedWords.length === 2) break;
        const obj = stage.words.find(x => x.w === w);
        if (obj) missedWords.push(obj);
      }
      const used = new Set(missedWords.map(x => x.w));
      const rest = AU.shuffle(stage.words.filter(x => !used.has(x.w)))
        .slice(0, WORDS_PER_GAME - missedWords.length);
      return AU.shuffle([...missedWords, ...rest]);
    }

    // ── Stage 1: tracing ──────────────────────────────────────────
    const LETTERS = 'abcdefghijklmnopqrstuvwxyz'.split('');
    const NUMBERS = '0123456789'.split('');
    const TRACE_GRID = 8;
    const COVER_TARGET = 0.70;

    const guideCanvas  = document.getElementById('guide-canvas');
    const drawCanvas   = document.getElementById('draw-canvas');
    const drawCtx      = drawCanvas.getContext('2d');
    drawCtx.lineWidth = 22;
    drawCtx.lineCap = 'round';
    drawCtx.lineJoin = 'round';
    drawCtx.strokeStyle = '#FF6B6B';
    const progressFill = document.getElementById('progress-fill');
    const checkFlash   = document.getElementById('check-flash');
    const clearBtn     = document.getElementById('clear-btn');

    let traceSession, traceIndex, coveredCells, letterCells, clears, locked;
    let drawing = false, lastX = null, lastY = null;

    function startTracing() {
      const pool = shuffle([...LETTERS, ...NUMBERS]);
      traceSession = pool.slice(0, WORDS_PER_GAME);
      traceIndex = 0;
      clears = 0;
      renderTraceProgress();
      loadTraceChar(traceSession[0]);
    }

    function renderTraceProgress() {
      progressEl.innerHTML = '';
      for (let i = 0; i < WORDS_PER_GAME; i++) {
        const d = document.createElement('div');
        d.className = 'dot' + (i < traceIndex ? ' done' : i === traceIndex ? ' current' : '');
        progressEl.appendChild(d);
      }
    }

    function loadTraceChar(char) {
      locked = false;
      coveredCells = new Set();
      drawCtx.clearRect(0, 0, 260, 260);
      progressFill.style.width = '0%';
      checkFlash.classList.remove('show');
      drawGuide(char);
      letterCells = buildLetterMap(char);
      if (/[0-9]/.test(char)) AU.speak(char);
      else AU.speak(char === 'x' ? 'x. x is in fox' : `${char}. ${char} is for ${AU.SOUND_WORDS[char]}`);
    }

    function drawGuide(char) {
      const gctx = guideCanvas.getContext('2d');
      gctx.clearRect(0, 0, 260, 260);
      gctx.font = '900 190px Arial, sans-serif';
      gctx.textAlign = 'center';
      gctx.textBaseline = 'middle';
      gctx.fillStyle = '#E8E8E8';
      gctx.fillText(char, 130, 130);
      gctx.strokeStyle = '#D0D0D0';
      gctx.lineWidth = 3;
      gctx.strokeText(char, 130, 130);
    }

    function buildLetterMap(char) {
      const oc = document.createElement('canvas');
      oc.width = 260; oc.height = 260;
      const octx = oc.getContext('2d');
      octx.font = '900 190px Arial, sans-serif';
      octx.textAlign = 'center';
      octx.textBaseline = 'middle';
      octx.fillStyle = '#000';
      octx.fillText(char, 130, 130);

      const data = octx.getImageData(0, 0, 260, 260).data;
      const cells = new Set();
      for (let gy = 0; gy < Math.ceil(260 / TRACE_GRID); gy++) {
        for (let gx = 0; gx < Math.ceil(260 / TRACE_GRID); gx++) {
          let found = false;
          for (let dy = 0; dy < TRACE_GRID && !found; dy++) {
            for (let dx = 0; dx < TRACE_GRID && !found; dx++) {
              const px = gx * TRACE_GRID + dx, py = gy * TRACE_GRID + dy;
              if (px < 260 && py < 260 && data[(py * 260 + px) * 4 + 3] > 60) found = true;
            }
          }
          if (found) cells.add(`${gx},${gy}`);
        }
      }
      return cells;
    }

    function traceXY(e) {
      const r = drawCanvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return [
        (t.clientX - r.left) * (260 / r.width),
        (t.clientY - r.top)  * (260 / r.height),
      ];
    }

    function traceStart(x, y) {
      if (locked) return;
      drawing = true;
      lastX = x; lastY = y;
      traceMove(x, y);
    }

    function traceMove(x, y) {
      if (!drawing || locked) return;
      drawCtx.beginPath();
      drawCtx.moveTo(lastX ?? x, lastY ?? y);
      drawCtx.lineTo(x, y);
      drawCtx.stroke();
      lastX = x; lastY = y;
      checkCoverage(x, y);
    }

    function traceEnd() {
      drawing = false;
      lastX = null; lastY = null;
    }

    function checkCoverage(x, y) {
      const gx = Math.floor(x / TRACE_GRID);
      const gy = Math.floor(y / TRACE_GRID);
      let newCells = false;
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          const key = `${gx + dc},${gy + dr}`;
          if (letterCells.has(key) && !coveredCells.has(key)) {
            coveredCells.add(key);
            newCells = true;
          }
        }
      }
      if (newCells) {
        game.sound('pop');
        updateTraceProgress();
      }
      if (!locked && coveredCells.size / letterCells.size >= COVER_TARGET) onTraceComplete();
    }

    function updateTraceProgress() {
      const pct = Math.min(1, coveredCells.size / letterCells.size);
      progressFill.style.width = (pct * 100) + '%';
    }

    function onTraceComplete() {
      locked = true;
      drawing = false;
      game.sound('correct');
      AU.speak(`${traceSession[traceIndex]}! well done`);
      checkFlash.classList.add('show');
      setTimeout(() => {
        traceIndex++;
        renderTraceProgress();
        if (traceIndex >= traceSession.length) {
          const stars = clears <= 1 ? 3 : clears <= 4 ? 2 : 1;
          game.showWin(stars, cb => { if (cb === 'again') startStage(currentStage); });
        } else {
          loadTraceChar(traceSession[traceIndex]);
        }
      }, 900);
    }

    function bindTracing() {
      clearBtn.addEventListener('click', () => {
        drawCtx.clearRect(0, 0, 260, 260);
        coveredCells = new Set();
        clears++;
        updateTraceProgress();
        game.sound('click');
      });

      drawCanvas.addEventListener('touchstart', e => {
        e.preventDefault();
        game._ctx();
        const [x, y] = traceXY(e);
        traceStart(x, y);
      }, { passive: false });
      drawCanvas.addEventListener('touchmove', e => {
        e.preventDefault();
        const [x, y] = traceXY(e);
        traceMove(x, y);
      }, { passive: false });
      drawCanvas.addEventListener('touchend', e => { e.preventDefault(); traceEnd(); }, { passive: false });
      drawCanvas.addEventListener('touchcancel', traceEnd);

      drawCanvas.addEventListener('mousedown', e => {
        game._ctx();
        const [x, y] = traceXY(e);
        traceStart(x, y);
      });
      drawCanvas.addEventListener('mousemove', e => {
        const [x, y] = traceXY(e);
        traceMove(x, y);
      });
      window.addEventListener('mouseup', traceEnd);
    }

    // ── Utilities ─────────────────────────────────────────────────
    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function delay(ms) {
      return new Promise(r => setTimeout(r, ms));
    }
  </script>
</body>
</html>
