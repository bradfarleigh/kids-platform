<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Word Sort</title>
  <link rel="stylesheet" href="../../css/kids.css">
  <style>
    body { background: linear-gradient(160deg, #d4fc79 0%, #96e6a1 100%); }

    #screen-mode {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; gap: 24px; padding: 80px 20px 32px;
      overflow-y: auto; width: 100%;
    }
    .mode-title {
      font-size: clamp(32px, 7vw, 56px); font-weight: 900;
      color: #1A202C; text-shadow: 0 2px 8px rgba(255,255,255,.4);
    }
    .mode-cards {
      display: grid; grid-template-columns: 1fr 1fr; gap: 18px;
      width: 100%; max-width: 500px;
    }
    .mode-card {
      background: white; border-radius: 24px; padding: 24px 14px;
      text-align: center; cursor: pointer; box-shadow: 0 8px 32px rgba(0,0,0,.12);
      transition: transform .15s cubic-bezier(.34,1.56,.64,1);
      display: flex; flex-direction: column; gap: 8px; align-items: center;
      border: none; font-family: inherit;
    }
    .mode-card:active { transform: scale(.93); }
    .mode-card-icon  { font-size: clamp(40px, 9vw, 60px); line-height: 1; }
    .mode-card-label { font-size: clamp(20px, 4.5vw, 28px); font-weight: 900; color: #1A202C; }
    .mode-card-sub   { font-size: 13px; font-weight: 700; color: #718096; }

    #screen-game { display: none; flex: 1; flex-direction: column; align-items: center; width: 100%; }

    .sort-header {
      width: 100%; padding: 72px 24px 12px;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .sort-progress { font-size: 20px; font-weight: 900; color: #1A202C; }
    .sort-score {
      font-size: 20px; font-weight: 900; color: #1A202C;
      display: flex; align-items: center; gap: 6px;
    }

    .sort-content {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      gap: clamp(16px, 3vh, 28px);
      padding: 0 16px 20px; width: 100%; max-width: 640px;
    }

    .sort-word {
      background: white; border-radius: 20px; padding: 18px 36px;
      font-size: clamp(32px, 9vw, 56px); font-weight: 900; color: #1A202C;
      box-shadow: 0 8px 28px rgba(0,0,0,.18);
      cursor: pointer; border: none; font-family: inherit;
      display: flex; align-items: center; gap: 14px;
    }
    .sort-word .spk { font-size: clamp(24px, 6vw, 40px); }

    .buckets { display: flex; gap: 12px; width: 100%; }
    .bucket {
      flex: 1; background: rgba(255,255,255,.35); border-radius: 16px;
      min-height: 38dvh; padding: 10px; border: none; cursor: pointer;
      font-family: inherit; display: flex; flex-direction: column; align-items: center;
    }
    .bucket-header {
      font-size: 24px; font-weight: 900; color: #1A202C; text-align: center;
      padding-bottom: 8px; width: 100%;
      border-bottom: 3px solid rgba(0,0,0,.1);
    }
    .chip {
      font-size: 16px; font-weight: 800; background: white; border-radius: 10px;
      padding: 6px 10px; margin-top: 8px; text-align: center; color: #1A202C;
    }

    .rule-overlay {
      position: fixed; inset: 0; z-index: 800;
      background: rgba(0,0,0,.45);
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .rule-card {
      background: white; border-radius: 28px; padding: 32px 28px;
      max-width: 380px; width: 100%; text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
      animation: bounce-in .4s cubic-bezier(.34,1.56,.64,1);
    }
    .rule-text { font-size: 20px; font-weight: 800; color: #1A202C; margin-bottom: 24px; line-height: 1.4; }
  </style>
</head>
<body>
  <button class="nav-back" id="back-btn">←</button>

  <div id="screen-mode">
    <div class="mode-title">Word Sort 🗂️</div>
    <div class="mode-cards" id="set-cards"></div>
  </div>

  <div id="screen-game">
    <div class="sort-header">
      <div class="sort-progress" id="progress">0 / 12</div>
      <div class="sort-score">⭐ <span id="score-val">0</span></div>
    </div>

    <div class="sort-content">
      <button class="sort-word" id="word-card"></button>
      <div class="buckets" id="buckets"></div>
    </div>
  </div>

  <script src="../_lib/confetti.js"></script>
  <script src="../_lib/KidsGame.js"></script>
  <script src="../_lib/words-au.js"></script>
  <script>
    const COLOURS = ['#6BCB77', '#FB923C', '#A78BFA', '#4ECDC4', '#FF6B6B', '#FFE66D'];
    const ROUND = 12;

    let game, set, queue, queueIndex, score, mistakes;

    const screenMode = document.getElementById('screen-mode');
    const screenGame = document.getElementById('screen-game');
    const setCards   = document.getElementById('set-cards');
    const progressEl = document.getElementById('progress');
    const scoreEl    = document.getElementById('score-val');
    const wordCard   = document.getElementById('word-card');
    const bucketsEl  = document.getElementById('buckets');
    const backBtn    = document.getElementById('back-btn');

    class SortGame extends KidsGame {
      init() {
        AU.SORTS.forEach((s, i) => {
          const btn = document.createElement('button');
          btn.className = 'mode-card';
          btn.style.borderTop = `6px solid ${COLOURS[i % COLOURS.length]}`;
          btn.innerHTML = `
            <span class="mode-card-icon">${s.icon}</span>
            <span class="mode-card-label">${s.title}</span>
            <span class="mode-card-sub">Ages ${s.ages} • ${s.cols.map(c => c.label).join(' · ')}</span>`;
          btn.addEventListener('click', () => { this._ctx(); startGame(s); });
          setCards.appendChild(btn);
        });
        backBtn.addEventListener('click', () => {
          if (screenGame.style.display !== 'none') showSetSelect();
          else this.home();
        });
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      game = new SortGame({ name: 'Word Sort' });
      game.init();
    });

    function startGame(chosen) {
      set = chosen;
      screenMode.style.display = 'none';
      screenGame.style.display = 'flex';

      const perCol = set.cols.length === 2 ? 6 : 4;
      queue = [];
      set.cols.forEach((col, ci) => {
        AU.shuffle([...col.words]).slice(0, perCol).forEach(w => queue.push({ w, col: ci }));
      });
      AU.shuffle(queue);

      queueIndex = 0;
      score = 0;
      mistakes = 0;
      scoreEl.textContent = '0';
      buildBuckets();
      renderWord();
    }

    function showSetSelect() {
      screenGame.style.display = 'none';
      screenMode.style.display = 'flex';
    }

    function buildBuckets() {
      bucketsEl.innerHTML = '';
      set.cols.forEach((col, ci) => {
        const b = document.createElement('button');
        b.className = 'bucket';
        b.dataset.col = ci;
        b.innerHTML = `<div class="bucket-header">${col.label}</div>`;
        b.addEventListener('click', () => sortInto(ci, b));
        bucketsEl.appendChild(b);
      });
    }

    function renderProgress() {
      progressEl.textContent = `${queueIndex} / ${ROUND}`;
    }

    function renderWord() {
      renderProgress();
      const item = queue[queueIndex];
      wordCard.innerHTML = `${item.w} <span class="spk">🔊</span>`;
      setTimeout(() => AU.speak(item.w), 400);
    }

    function sortInto(ci, bucketEl) {
      game._ctx();
      const item = queue[queueIndex];
      if (ci === item.col) {
        game.sound('pop');
        const chip = document.createElement('div');
        chip.className = 'chip anim-pop-in';
        chip.textContent = item.w;
        bucketEl.appendChild(chip);
        score += 10;
        scoreEl.textContent = score;
        queueIndex++;
        renderProgress();
        if (queueIndex >= ROUND) finishRound();
        else renderWord();
      } else {
        game.wrong(bucketEl);
        mistakes++;
      }
    }

    function finishRound() {
      wordCard.style.visibility = 'hidden';
      const overlay = document.createElement('div');
      overlay.className = 'rule-overlay';
      overlay.innerHTML = `
        <div class="rule-card">
          <div class="rule-text">${set.rule}</div>
          <button class="btn btn-primary" id="rule-ok">Got it! 👍</button>
        </div>`;
      document.body.appendChild(overlay);
      AU.speak(set.rule, { rate: 0.95 });
      overlay.querySelector('#rule-ok').addEventListener('click', () => {
        overlay.remove();
        wordCard.style.visibility = 'visible';
        const stars = mistakes <= 1 ? 3 : mistakes <= 4 ? 2 : 1;
        game.showWin(stars, action => { if (action === 'again') startGame(set); });
      });
    }

    wordCard.addEventListener('click', () => {
      game._ctx();
      AU.speak(queue[queueIndex].w);
    });
  </script>
</body>
</html>
